<style>
  :root {
    --ink: #0B1220;
    --paper: #F3F5F7;
    --panel-line: #E2E6EA;
    --slate-600: #475569;
    --slate-500: #64748B;
    --signal: #4A4CE8;
    --signal-dark: #3634C2;
    --circuit: #17C3A2;
    --circuit-dark: #0EA085;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--paper);
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-x: hidden;
  }

  /* subtle circuit dot-grid, matching the SBITS brand background */
  .grid-bg {
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle, rgba(11,18,32,0.06) 1px, transparent 1px);
    background-size: 26px 26px;
    pointer-events: none;
  }

  main {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .panel {
    width: 100%;
    max-width: 460px;
    text-align: center;
  }

  .logo {
    width: 64px;
    height: auto;
    margin: 0 auto 32px;
    display: block;
    border-radius: 10px;
  }

  h1 {
    font-family: 'Space Grotesk', 'Inter', sans-serif;
    font-weight: 600;
    font-size: clamp(1.75rem, 4vw, 2.35rem);
    line-height: 1.2;
    letter-spacing: -0.01em;
    margin: 0 0 16px;
    color: var(--ink);
  }

  p.lead {
    margin: 0 0 32px;
    font-size: 1.0625rem;
    line-height: 1.6;
    color: var(--slate-600);
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    border-radius: 999px;
    background: #ffffff;
    border: 1px solid var(--panel-line);
    font-size: 0.875rem;
    color: var(--ink);
    margin-bottom: 36px;
    box-shadow: 0 1px 0 0 rgba(11,18,32,0.04);
  }

  .status .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--circuit);
    animation: pulseline 1.8s ease-in-out infinite;
    flex-shrink: 0;
  }

  @keyframes pulseline {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 1; }
  }

  .contact {
    font-size: 0.9375rem;
    color: var(--slate-600);
    line-height: 1.6;
  }

  .contact a {
    color: var(--signal);
    text-decoration: none;
    font-weight: 500;
    border-bottom: 1px solid rgba(74,76,232,0.35);
    transition: border-color 0.15s ease;
  }

  .contact a:hover,
  .contact a:focus-visible {
    border-color: var(--signal);
  }

  .contact a:focus-visible {
    outline: 2px solid var(--signal);
    outline-offset: 3px;
    border-radius: 2px;
  }

  footer {
    position: relative;
    z-index: 1;
    padding: 20px;
    text-align: center;
    font-size: 0.75rem;
    color: var(--slate-500);
  }

  @media (prefers-reduced-motion: reduce) {
    .status .dot { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
  <div class="grid-bg"></div>
